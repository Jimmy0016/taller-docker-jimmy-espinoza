# Nombre de la acción
name: Construir y Publicar Imagen (Jimmy)

# Cuándo debe ejecutarse este robot
on:
  push:
    # Solo cuando se suba código a la rama "espinoza"
    branches: [ "espinoza" ]

# Qué trabajos debe hacer
jobs:
  build-and-push:
    # El robot usará una máquina virtual con Ubuntu (Linux)
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Dale permisos al robot para escribir en tus "Packages"
    permissions:
      contents: read
      packages: write 
      

    steps:
      # 1. El robot "descarga" tu código (app.py, Dockerfile, etc.)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. El robot "inicia sesión" en el registro de paquetes de GitHub
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          # Esto leerá automáticamente tu nombre de usuario (ej. "jimmy")
          username: ${{ github.repository_owner }} 
          password: ${{ secrets.GITHUB_TOKEN }} # Esto es un token mágico que GitHub le da

      # 3. El robot construye tu imagen y la sube
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          # Le dice dónde está tu Dockerfile (en la raíz '.')
          context: .
          # Le decimos que SÍ la suba (push)
          push: true
        
          tags: ghcr.io/jimmy0016/taller-docker-jimmy-espinoza:1.0

