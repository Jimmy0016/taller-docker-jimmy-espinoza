# Nombre de la acción
name: Construir y Publicar Imagen (Jimmy)

# Cuándo debe ejecutarse este robot
on:
  push:
    # Solo cuando se suba código a la rama "espinoza"
    branches: [ "espinoza" ]

# Qué trabajos debe hacer
jobs:
  build-and-push:
    # El robot usará una máquina virtual con Ubuntu (Linux)
    runs-on: ubuntu-latest
    
    # IMPORTANTE: Dale permisos al robot para escribir en tus "Packages"
    permissions:
      contents: read
      packages: write
      
    steps:
      # 1. El robot "descarga" tu código (app.py, Dockerfile, etc.)
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. El robot "inicia sesión" en el registro de paquetes de GitHub
      # Nota: Usaremos el username en minúsculas para evitar errores
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          # Usamos tolower para convertir el nombre de usuario a minúsculas,
          # ya que GHCR lo requiere.
          username: ${{ tolower(github.repository_owner) }} 
          password: ${{ secrets.GITHUB_TOKEN }} 

      # 3. El robot construye tu imagen y la sube
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          # Le dice dónde está tu Dockerfile (en la raíz '.')
          context: .
          # Le decimos que SÍ la suba (push)
          push: true
          # **CORRECCIÓN DE ERROR:** El nombre del repositorio DEBE ser en minúsculas.
          # Usamos la función tolower para asegurar que el nombre de usuario sea válido.
          tags: ghcr.io/${{ tolower(github.repository_owner) }}/jimmy-app:1.0.1