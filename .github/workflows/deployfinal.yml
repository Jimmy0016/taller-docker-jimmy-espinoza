# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Despliegue de Hola mundo

on:
  push:
    branches: "espinoza"

permissions:
    contents: read
    packages: write
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.11"
    
    - name: 🔐 Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        push: true
        tags: pgespinoza:1.0.1

    - name: Pasar el stack.yml al servidor
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOSTNAME }}
        port: ${{ secrets.VPS_SSH_PORT }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        script: |
            echo "Deployando los servicios"

            cd ~/automatizar

            echo "${{ secrets.GHCR_PAT}} | docker login ghr.io -u jimmy0016 --password-stdin"

            docker pull pgespinoza:1.0.1

            docker stack rm quintob || true 

            sleep 40



            docker stack deploy --with-registry-auth -c stack.yml quintob

            sleep 30


            docker ps

