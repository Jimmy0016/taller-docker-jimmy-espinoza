name: CI/CD - Llinin

# 👇 ESTA SECCIÓN ES CLAVE — define el trigger
on:
  push:
    branches:
      - jimmy       # se ejecuta cuando haces push a la rama 'llinin'
  pull_request:
    branches:
      - jimmy

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js (example)
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run build
        run: npm run build

      - name: List files
        run: ls -la
